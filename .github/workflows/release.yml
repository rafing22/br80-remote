name: Release Please
# Gira ad ogni push su main: legge i commit Conventional Commits e mantiene
# aperta/aggiornata una "Release PR" con versionName (in build.gradle.kts) e
# CHANGELOG.md già aggiornati. Quando la mergi, crea da sola tag + Release.
# Il build/attach dell'APK resta in build.yml, triggerato dal tag risultante.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - id: release
        name: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: simple
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Token personale invece del GITHUB_TOKEN di default: i tag creati
          # con il token automatico NON fanno scattare altri workflow (misura
          # anti-loop di GitHub), quindi build.yml non partirebbe mai sul tag
          # appena creato. Con un PAT, il tag conta come un'azione "umana" e
          # innesca regolarmente build.yml.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # L'updater "generic" di release-please (marker x-release-please-version)
  # si è dimostrato inaffidabile su questo file: non aggiornava versionName.
  # Questo job aggiorna sia versionName (letto dal manifest, che invece
  # release-please aggiorna correttamente) sia versionCode (auto-incrementato
  # di +1, scollegato dal semver) con un commit aggiuntivo sulla stessa
  # Release PR, prima che tu la mergi.
  sync-android-version:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch della Release PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJson(needs.release-please.outputs.pr).headBranchName }}

      - name: Sincronizza versionName e versionCode
        run: |
          set -euo pipefail
          newVersionName=$(python3 -c "import json; print(json.load(open('.release-please-manifest.json'))['.'])")
          currentVersionCode=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          nextVersionCode=$((currentVersionCode + 1))

          sed -i "s/versionCode = $currentVersionCode \/\/ x-release-please-versionCode/versionCode = $nextVersionCode \/\/ x-release-please-versionCode/" app/build.gradle.kts
          sed -i "s/versionName = \"[0-9.]*\" \/\/ x-release-please-version/versionName = \"$newVersionName\" \/\/ x-release-please-version/" app/build.gradle.kts

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          if ! git diff --cached --quiet; then
            git commit -m "chore: sincronizza versionName a $newVersionName e versionCode a $nextVersionCode"
            git push
          fi
