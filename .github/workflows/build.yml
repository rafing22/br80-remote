name: Build APK

on:
  push:
    branches: [ main, "feature/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Prepare APK with release naming
        run: |
          mkdir -p release_apk
          TAG_OR_BRANCH="${{ github.ref_name }}"
          VERSION="${TAG_OR_BRANCH#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="1.5"
          fi
          cp app/build/outputs/apk/debug/*.apk "release_apk/Livall-BR80-Remote-v${VERSION}.apk"
          echo "APK_NAME=Livall-BR80-Remote-v${VERSION}.apk" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: release_apk/${{ env.APK_NAME }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release_apk/${{ env.APK_NAME }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Livall BR80 Remote ${{ github.ref_name }}
            - 🤖 **Gemini / Assistente in Background**: Avvio di Gemini e Voice Search da qualsiasi app o a schermo spento (tramite `KEYCODE_VOICE_ASSIST` e autorizzazione overlay).
            - ⚡ **Auto-Ascolto all'Avvio**: Avvio immediato dello scanner BLE senza dover premere "Connetti".
            - 📱 **Scansione Bilanciata (BALANCED)**: Zero latenza e cattura immediata del segnale del telecomando.
            - 🛡️ **Standby Listener & Riconnessione Istantanea**: Risolta la perdita di connessione quando il BR80 va in standby.
            - ⚡ **Riconnessione a 1-Click (Fix Errore GATT 133)**: Riconnessione fluida con pulizia cache Bluetooth GATT.
            - 💓 **Keep-Alive 35s Attivo**: Ping periodico anti-sleep per reattività istantanea ai pulsanti.
            - 🔋 **WakeLock & Overlay**: Risveglio dello schermo per azioni e notifiche durante la guida.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
