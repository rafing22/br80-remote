name: Build APK

on:
  push:
    branches: [ main, "feature/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Prepare APK with release naming
        run: |
          mkdir -p release_apk
          TAG_OR_BRANCH="${{ github.ref_name }}"
          VERSION="${TAG_OR_BRANCH#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="1.5"
          fi
          cp app/build/outputs/apk/debug/*.apk "release_apk/Livall-BR80-Remote-v${VERSION}.apk"
          echo "APK_NAME=Livall-BR80-Remote-v${VERSION}.apk" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: release_apk/${{ env.APK_NAME }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release_apk/${{ env.APK_NAME }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Livall BR80 Remote ${{ github.ref_name }}
            - 🎛️ **Redesign "Cruscotto" scuro**: tema scuro su tutta l'app, D-pad a sagoma reale del telecomando, gauge analogici batteria/RSSI, card "ultima azione eseguita".
            - 🌑 **Dialog coerenti**: tutti i popup (dispositivi BT/Audio, profili, scegli azione, testi TTS) ritemati in stile scuro, niente più popup bianchi di sistema.
            - 🔊 **Testi TTS riorganizzati**: raggruppati per tasto fisico con badge, tag di gesto in monospace e indicatore "personalizzato" solo dove serve.
            - 🧹 **Rimosso Auto-Apprendimento Ritmo**: restano i 4 preset rapidi (Sportivo/Standard/Guanti/Lento) per la finestra doppio/triplo tap.
            - 📡 **Priorità BLE adattiva**: priorità di connessione regolata in base all'RSSI per maggiore stabilità con segnale debole.

            Changelog completo nel [README](https://github.com/rafing22/br80-remote#-novità-versione-3x).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
