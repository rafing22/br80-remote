name: Build APK

on:
  push:
    branches: [ main, "feature/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Prepare APK with release naming
        run: |
          mkdir -p release_apk
          # Su eventi pull_request, github.ref_name vale qualcosa come "8/merge"
          # (non un nome di branch/tag) e lo slash romperebbe il path del file:
          # su PR usa invece head_ref (il nome reale del branch sorgente) e in
          # ogni caso sanitizza eventuali "/" residui (es. branch "feature/x").
          TAG_OR_BRANCH="${{ github.head_ref || github.ref_name }}"
          VERSION="${TAG_OR_BRANCH#v}"
          VERSION="${VERSION//\//-}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="dev"
          fi
          cp app/build/outputs/apk/debug/*.apk "release_apk/Livall-BR80-Remote-v${VERSION}.apk"
          echo "APK_NAME=Livall-BR80-Remote-v${VERSION}.apk" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.APK_NAME }}
          path: release_apk/${{ env.APK_NAME }}

  # Job separato, con permessi elevati solo qui: gira SOLO sui push di tag,
  # mai su pull_request, così le build di anteprima sulle PR non richiedono
  # mai "contents: write" (che su eventi pull_request può far fallire il job
  # con un generico "workflow file issue" se il permesso non è concesso per
  # quel contesto).
  attach-to-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determina nome APK
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "APK_NAME=Livall-BR80-Remote-v${VERSION}.apk" >> $GITHUB_ENV

      - name: Scarica APK compilato
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.APK_NAME }}
          path: release_apk

      # La Release con tag/nome/changelog è già stata creata da release-please
      # (workflow release.yml) quando hai mergiato la Release PR. Questo step
      # si limita ad allegare l'APK compilato alla release già esistente con
      # lo stesso tag: niente "name"/"body" qui, per non sovrascrivere il
      # changelog che release-please ha già scritto.
      # Usa lo STESSO token (PAT) con cui release-please ha creato la release:
      # il GITHUB_TOKEN di default non riesce a modificare una release creata
      # da un'identità diversa ("Resource not accessible by integration").
      - name: Attach APK to existing Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release_apk/${{ env.APK_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
