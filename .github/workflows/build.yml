name: Build APK

on:
  push:
    branches: [ main, "feature/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Prepare APK with release naming
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/*.apk release_apk/Livall-BR80-Remote-v1.4.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Livall-BR80-Remote-v1.4
          path: release_apk/Livall-BR80-Remote-v1.4.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release_apk/Livall-BR80-Remote-v1.4.apk
          name: Release ${{ github.ref_name }}
          body: |
            ## Livall BR80 Remote ${{ github.ref_name }}
            - 🛡️ **Standby Listener & Riconnessione Istantanea**: Risolta la disconnessione in standby dello smartphone e del telecomando.
            - 📱 **Scansione a Schermo Spento (ScanFilter)**: Filtri dedicati compatibili con le restrizioni di background di Android 8–14+.
            - ⚡ **Riconnessione a 1-Click (Fix Errore GATT 133)**: Eliminato il bisogno di fare doppio connetti/disconnetti grazie alla pulizia cache GATT con refresh e rilascio ritardato.
            - 💓 **Keep-Alive Attivo di Default**: Ping periodico a 35s per prevenire lo spegnimento per inattività del telecomando durante i percorsi.
            - 🔋 **WakeLock Ottimizzato**: Esecuzione istantanea e senza lag delle azioni anche con telefono in tasca / schermo bloccato.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
