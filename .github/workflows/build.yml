name: Build APK

on:
  push:
    branches: [ main, "feature/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Prepare APK with release naming
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/*.apk release_apk/Livall-BR80-Remote-v1.3.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Livall-BR80-Remote-v1.3
          path: release_apk/Livall-BR80-Remote-v1.3.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release_apk/Livall-BR80-Remote-v1.3.apk
          name: Release ${{ github.ref_name }}
          body: |
            ## Livall BR80 Remote ${{ github.ref_name }}
            - 🎯 Sistema di Calibrazione e Auto-Apprendimento del ritmo doppio/triplo tap (3 tentativi).
            - ⏱️ Profili rapidi di velocità di risposta (Sportivo 280ms, Standard 420ms, Guanti 550ms, Lento 700ms).
            - 🔄 Aggiornamento in-app migliorato con gestione redirect AWS S3 e User-Agent.
            - 🚀 Ricevitore Boot per avvio automatico del servizio in background all'accensione dello smartphone.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
