name: Build APK

on:
  push:
    branches: [ main, "feature/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Prepare APK with release naming
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/*.apk release_apk/Livall-BR80-Remote-v1.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Livall-BR80-Remote-v1.1
          path: release_apk/Livall-BR80-Remote-v1.1.apk
