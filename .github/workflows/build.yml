name: Build APK

on:
  push:
    branches: [ main, "feature/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Prepare APK with release naming
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/*.apk release_apk/Livall-BR80-Remote-v1.2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Livall-BR80-Remote-v1.2
          path: release_apk/Livall-BR80-Remote-v1.2.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release_apk/Livall-BR80-Remote-v1.2.apk
          name: Release ${{ github.ref_name }}
          body: |
            ## Livall BR80 Remote ${{ github.ref_name }}
            - Aggiornamento in-app automatico da GitHub Releases.
            - Nuovo controller D-Pad e icona fedele al dispositivo Livall BR80 reale (tasto centrale STOP rosso, frecce L/R, Foto e Voce).
            - Categorie azioni collassabili ad accordion (chiuse all'avvio) con ricerca dinamica.
            - Auto-healing con Watchdog a 15 secondi per riconnessione automatica senza blocchi.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
